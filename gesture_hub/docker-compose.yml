version: '3.8'

services:
  gesture_hub:
    build: .
    container_name: gesture_hub_app
    environment:
      # Required for X11 forwarding to Windows (VcXsrv)
      - DISPLAY=host.docker.internal:0.0
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
    devices:
      # Required to pass the USB webcam from WSL2 into the container
      - /dev/video0:/dev/video0
    ipc: host
    network_mode: host
